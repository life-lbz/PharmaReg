# PharmaReg 监控抓取配置（可选监控栈）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "pharmareg-backend"
    metrics_path: /health
    static_configs:
      - targets: ["backend:8000"]
        labels:
          component: backend

  - job_name: "pharmareg-mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]
        labels:
          component: mysql

  - job_name: "pharmareg-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: redis
